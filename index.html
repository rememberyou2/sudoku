<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數獨</title>
<style>
  :root {
    --bg: #fdf6e9; --card: #fff; --line: #8a7a66; --thin: #d9cfc0;
    --sel: #ffe08a; --same: #ffefc0; --peer: #fbf1de;
    --given: #2b2b2b; --user: #1c6fd1; --err: #d93025; --btn: #e8742a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #333;
         display: flex; flex-direction: column; align-items: center; padding: 12px; }
  h1 { margin: 4px 0 8px; font-size: 28px; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 20px; }
  select, button { font: inherit; font-size: 20px; border-radius: 12px; border: 2px solid var(--btn); padding: 10px 16px; background: #fff; color: #333; }
  button { background: var(--btn); color: #fff; border: none; font-weight: bold; cursor: pointer; }
  button:active { transform: scale(.96); }
  button.alt { background: #fff; color: var(--btn); border: 2px solid var(--btn); }
  button.on { background: #1c6fd1; color: #fff; border-color: #1c6fd1; }
  #board { --size: min(94vw, 62vh, 560px); width: var(--size); height: var(--size); display: grid;
           grid-template-columns: repeat(9, 1fr); border: 3px solid var(--line); background: var(--card); touch-action: manipulation; }
  .cell { display: flex; align-items: center; justify-content: center; border: 1px solid var(--thin); position: relative;
          font-size: calc(var(--size) / 15); cursor: pointer; user-select: none; }
  .cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right: 3px solid var(--line); }
  .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid var(--line); }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.sel { background: var(--sel); }
  .cell.given { color: var(--given); font-weight: bold; }
  .cell.user { color: var(--user); }
  .cell.bad { color: var(--err); background: #fde0dd; }
  .notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; font-size: calc(var(--size) / 34); color: #777; }
  .notes span { display: flex; align-items: center; justify-content: center; }
  #pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; width: min(94vw, 560px); }
  #pad button { font-size: 30px; padding: 12px 0; }
  #pad button.wide { font-size: 20px; }
  #msg { min-height: 36px; margin-top: 10px; font-size: 22px; font-weight: bold; text-align: center; }
  .win { color: #1e8e3e; }
</style>
</head>
<body>
<h1>🧩 數獨</h1>
<div class="bar">
  <select id="level">
    <option value="38">簡單</option>
    <option value="32" selected>普通</option>
    <option value="27">困難</option>
  </select>
  <button id="new">新遊戲</button>
  <span>⏱ <b id="time">00:00</b></span>
</div>
<div id="board"></div>
<div id="pad"></div>
<div id="msg"></div>

<script>
// ---------- 數獨產生器 ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ok(g, i, v) {
  const r = i / 9 | 0, c = i % 9, br = r - r % 3, bc = c - c % 3;
  for (let k = 0; k < 9; k++) {
    if (g[r * 9 + k] === v || g[k * 9 + c] === v) return false;
    if (g[(br + (k / 3 | 0)) * 9 + bc + k % 3] === v) return false;
  }
  return true;
}
function fill(g) {
  const i = g.indexOf(0); if (i < 0) return true;
  for (const v of shuffle([1,2,3,4,5,6,7,8,9])) { if (ok(g, i, v)) { g[i] = v; if (fill(g)) return true; g[i] = 0; } }
  return false;
}
function count(g, limit) { // 計算解的數量(最多算到 limit)
  let best = -1, opts = null;
  for (let i = 0; i < 81; i++) if (!g[i]) {
    const o = []; for (let v = 1; v <= 9; v++) if (ok(g, i, v)) o.push(v);
    if (!o.length) return 0;
    if (!opts || o.length < opts.length) { best = i; opts = o; if (o.length === 1) break; }
  }
  if (best < 0) return 1;
  let n = 0;
  for (const v of opts) { g[best] = v; n += count(g, limit - n); g[best] = 0; if (n >= limit) break; }
  return n;
}
function generate(clues) {
  const sol = Array(81).fill(0); fill(sol);
  const puz = sol.slice();
  let left = 81;
  for (const i of shuffle([...Array(81).keys()])) {
    if (left <= clues) break;
    const v = puz[i]; puz[i] = 0;
    if (count(puz.slice(), 2) !== 1) puz[i] = v; else left--;
  }
  return { puz, sol };
}

// ---------- 遊戲狀態 ----------
let puz, sol, cur, notes, sel = -1, noteMode = false, history = [], secs = 0, timer = null, done = false;
const $ = id => document.getElementById(id);
const boardEl = $('board'), msgEl = $('msg');

function save() { try { localStorage.setItem('sudoku', JSON.stringify({ puz, sol, cur, notes: notes.map(s => [...s]), secs, level: $('level').value })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('sudoku'));
    if (!d) return false;
    puz = d.puz; sol = d.sol; cur = d.cur; notes = d.notes.map(a => new Set(a)); secs = d.secs; $('level').value = d.level;
    return true;
  } catch (e) { return false; }
}

function newGame() {
  msgEl.textContent = '產生題目中…';
  setTimeout(() => {
    const g = generate(+$('level').value);
    puz = g.puz; sol = g.sol; cur = puz.slice(); notes = Array.from({ length: 81 }, () => new Set()); secs = 0;
    start();
  }, 30);
}
function start() {
  sel = -1; history = []; done = false; msgEl.textContent = ''; msgEl.className = '';
  clearInterval(timer); timer = setInterval(() => { if (!done) { secs++; tick(); if (secs % 5 === 0) save(); } }, 1000);
  tick(); render(); save();
}
function tick() { $('time').textContent = String(secs / 60 | 0).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'); }

// ---------- 畫面 ----------
function build() {
  for (let i = 0; i < 81; i++) {
    const d = document.createElement('div'); d.className = 'cell'; d.onclick = () => { sel = i; render(); };
    boardEl.appendChild(d);
  }
  const pad = $('pad');
  for (let n = 1; n <= 9; n++) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => input(n); pad.appendChild(b); }
  const mk = (t, f, cls, id) => { const b = document.createElement('button'); b.textContent = t; b.className = 'wide ' + (cls || ''); if (id) b.id = id; b.onclick = f; pad.appendChild(b); };
  mk('清除', () => input(0));
  mk('復原', undo, 'alt');
  mk('筆記:關', () => { noteMode = !noteMode; $('noteBtn').textContent = '筆記:' + (noteMode ? '開' : '關'); $('noteBtn').classList.toggle('on', noteMode); }, 'alt', 'noteBtn');
  mk('提示', hint, 'alt');
  mk('檢查', check, 'alt');
}
function render() {
  const cells = boardEl.children, sv = sel >= 0 ? cur[sel] : 0;
  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = cur[i], r = i / 9 | 0, c = i % 9;
    let cls = 'cell';
    if (sel >= 0) {
      const sr = sel / 9 | 0, sc = sel % 9;
      if (i === sel) cls += ' sel';
      else if (sv && v === sv) cls += ' same';
      else if (r === sr || c === sc || ((r / 3 | 0) === (sr / 3 | 0) && (c / 3 | 0) === (sc / 3 | 0))) cls += ' peer';
    }
    if (puz[i]) cls += ' given'; else if (v) cls += ' user';
    el.className = cls;
    if (v) el.textContent = v;
    else if (notes[i].size) el.innerHTML = '<div class="notes">' + [1,2,3,4,5,6,7,8,9].map(n => '<span>' + (notes[i].has(n) ? n : '') + '</span>').join('') + '</div>';
    else el.textContent = '';
  }
}
function input(n) {
  if (done) return;
  if (sel < 0) { say('請先點一個格子'); return; }
  if (puz[sel]) { say('這格是題目,不能改'); return; }
  history.push({ i: sel, v: cur[sel], n: new Set(notes[sel]) });
  if (n && noteMode) { cur[sel] = 0; notes[sel].has(n) ? notes[sel].delete(n) : notes[sel].add(n); }
  else {
    cur[sel] = n; notes[sel].clear(); say('');
    if (n) { // 清掉同行同列同宮的筆記
      const r = sel / 9 | 0, c = sel % 9;
      for (let i = 0; i < 81; i++) if ((i / 9 | 0) === r || i % 9 === c || ((i / 27 | 0) === (r / 3 | 0) && (i % 9 / 3 | 0) === (c / 3 | 0))) notes[i].delete(n);
    }
  }
  render(); save(); checkWin();
}
function undo() {
  const h = history.pop(); if (!h || done) return;
  cur[h.i] = h.v; notes[h.i] = h.n; sel = h.i; render(); save();
}
function hint() {
  if (done) return;
  let i = (sel >= 0 && !puz[sel] && cur[sel] !== sol[sel]) ? sel : -1;
  if (i < 0) { const bad = [...Array(81).keys()].filter(k => !puz[k] && cur[k] !== sol[k]); if (!bad.length) return; i = bad[Math.random() * bad.length | 0]; }
  history.push({ i, v: cur[i], n: new Set(notes[i]) });
  cur[i] = sol[i]; notes[i].clear(); sel = i; render(); save(); say('已幫您填入一格 👍'); checkWin();
}
function check() {
  if (done) return;
  const cells = boardEl.children; let bad = 0;
  for (let i = 0; i < 81; i++) if (cur[i] && cur[i] !== sol[i]) { cells[i].classList.add('bad'); bad++; }
  say(bad ? `有 ${bad} 格填錯了(紅色)` : '目前都是對的,繼續加油!');
  if (bad) setTimeout(render, 2500);
}
function say(t) { msgEl.textContent = t; msgEl.className = ''; }
function checkWin() {
  if (cur.every((v, i) => v === sol[i])) {
    done = true; clearInterval(timer); msgEl.className = 'win';
    msgEl.textContent = `🎉 恭喜完成!用了 ${$('time').textContent}`;
    try { localStorage.removeItem('sudoku'); } catch (e) {}
  }
}
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') input(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') input(0);
  else if (sel >= 0 && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const r = sel / 9 | 0, c = sel % 9;
    if (e.key === 'ArrowUp' && r > 0) sel -= 9; if (e.key === 'ArrowDown' && r < 8) sel += 9;
    if (e.key === 'ArrowLeft' && c > 0) sel--; if (e.key === 'ArrowRight' && c < 8) sel++;
    render();
  }
});
$('new').onclick = () => { if (done || confirm('要開始新遊戲嗎?目前進度會消失。')) newGame(); };

build();
if (load()) { start(); } else newGame();
</script>
</body>
</html>
